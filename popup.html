<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }
    .feature-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed #f3f4f6;
    }
    .feature-item:last-child {
      border-bottom: none;
    }
    .feature-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 500;
      color: #374151;
    }
    .feature-icon {
      font-size: 16px;
      display: inline-flex;
      align-items: center;
    }
    /* Toggle switch slider styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #5a5472ff;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .footer {
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px solid #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🛠️</span>
    <h3>eBay Sales Insights</h3>
  </div>

  <div class="feature-item">
    <div class="feature-label">
      <span class="feature-icon">📥</span>
      <span>Image Downloader</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableImgDownload">
      <span class="slider"></span>
    </label>
  </div>

  <div class="feature-item">
    <div class="feature-label">
      <span class="feature-icon">📊</span>
      <span>Sold History Button</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableSoldHistory">
      <span class="slider"></span>
    </label>
  </div>

  <div class="feature-item">
    <div class="feature-label">
      <span class="feature-icon">🔗</span>
      <span>Seller Hub Sold Icon</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableActiveListingsIcon">
      <span class="slider"></span>
    </label>
  </div>

  <div class="feature-item">
    <div class="feature-label">
      <span class="feature-icon">📈</span>
      <span>Purchase History Sidebar</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableAnalyticsSidebar">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    eBay Sales Insights & Downloader v1.2
  </div>

  <script src="popup.js"></script>
</body>
</html>
