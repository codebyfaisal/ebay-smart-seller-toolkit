<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Actions Section -->
    <div
      style="
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      "
    >
      <button id="btnScrapeSearch" class="search-to-clipboard">
        <span style="font-size: 16px">📋</span> Scrape Search to Clipboard
        (JSON)
      </button>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">📥</span>
        <span>Image Downloader</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableImgDownload" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">📊</span>
        <span>Sold History (Search Page)</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableSoldHistorySearch" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">📊</span>
        <span>Sold History (Listing Page)</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableSoldHistoryListing" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">📊</span>
        <span>Sold History (Carousels)</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableSoldHistoryCarousel" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">📊</span>
        <span>Sold History (Shop Pages)</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableSoldHistoryStore" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="feature-item">
      <div class="feature-label">
        <span class="feature-icon">🔗</span>
        <span>Sold History (Active listings Page)</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableActiveListingsIcon" />
        <span class="slider"></span>
      </label>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
